app:
  gateway:
    client-id: ${GATEWAY_CLIENT_ID}
    client-secret: ${GATEWAY_CLIENT_SECRET}
  adapters:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      max-age: ${CORS_MAX_AGE:3600}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

    org.springframework.boot.actuate: WARN
    org.springframework.boot.actuate.endpoint.web.servlet.AbstractWebMvcEndpointHandlerMapping: WARN


spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}

  session:
    timeout: 30m
    data:
      redis:
        namespace: waregang:session

  security:
    oauth2:
      client:
        registration:
          waregang-api-gateway:
            provider: waregang-auth
            client-id: ${GATEWAY_CLIENT_ID}
            client-secret: ${GATEWAY_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - wms:all
#        provider:
#          waregang-auth:
#            issuer-uri: ${AUTH_SERVER_ISSUER_URL}
        provider:
          waregang-auth:
            # Убрали issuer-uri — больше не ходим за discovery при старте
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://auth-service:9000/oauth2/token
            jwk-set-uri: http://auth-service:9000/oauth2/jwks
            user-info-uri: http://auth-service:9000/userinfo
            user-name-attribute: sub

  cloud:
    gateway:
      default-filters:
        - SaveSession
        - TokenRelay
