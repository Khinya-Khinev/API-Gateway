app:
  gateway:
    client-id: ${GATEWAY_CLIENT_ID}
    client-secret: ${GATEWAY_CLIENT_SECRET}
  adapters:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}
      allowed-headers: ${CORS_ALLOWED_HEADERS}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS}
      max-age: ${CORS_MAX_AGE}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.actuate: WARN

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}

  session:
    timeout: ${SESSION_DURATION}
    data:
      redis:
        namespace: waregang:session

  security:
    oauth2:
      client:
        registration:
          waregang-api-gateway:
            provider: waregang-auth
            client-id: ${GATEWAY_CLIENT_ID}
            client-secret: ${GATEWAY_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - wms:all
        provider:
          waregang-auth:
            authorization-uri: ${AUTHORIZATION_URI}
            token-uri: ${TOKEN_URI}
            jwk-set-uri: ${JWK_SET_URI}
            user-info-uri: ${USER_INFO_URI}
            user-name-attribute: sub

  cloud:
    gateway:
      default-filters:
        - SaveSession
        - TokenRelay
      server:
        webflux:
          routes:
#            # ========== Бизнес-роуты ==========
#            - id: receiving-service
#              uri: http://receiving-service:8080
#              predicates:
#                - Path=/api/receiving-service/**
#              filters:
#                - TokenRelay
#
#            - id: user-service
#              uri: http://auth-service:9000
#              predicates:
#                - Path=/api/users/**
#              filters:
#                - TokenRelay

            # ========== Роуты для OpenAPI-спек ==========
            - id: auth-service-docs
              uri: http://auth-service:9000
              predicates:
                - Path=/v3/api-docs/auth-service/**

            - id: receiving-service-docs
              uri: http://receiving-service:8080
              predicates:
                - Path=/v3/api-docs/receiving-service/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
#    oauth:
#      client-id: ${GATEWAY_CLIENT_ID}
#      # client-secret нужен только если client confidential
#      # client-secret: ${GATEWAY_CLIENT_SECRET}
#      use-pkce-with-authorization-code-grant: true
#      scopes: openid,profile,wms:all
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: receiving-service
        url: /v3/api-docs/receiving-service
  api-docs:
    enabled: true